name: 'Testing E2E (Chained)'

on:
  workflow_run:
    workflows: ['Trigger E2E']
    types: ['completed']

permissions:
  contents: read
  actions: read

jobs:
  download_repo_name:
    runs-on: ubuntu-latest
    outputs:
      repo_name: '${{ steps.out.outputs.repo_name }}'
      head_sha: '${{ steps.out.outputs.head_sha }}'
    steps:
      - name: 'Download the repo_name artifact'
        uses: actions/download-artifact@v4
        with:
          github-token: '${{ secrets.GITHUB_TOKEN }}'
          name: repo_name
          run-id: '${{ github.event.workflow_run.id }}'
          path: artifacts
      - id: out
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            core.setOutput('repo_name', fs.readFileSync('artifacts/repo_name', 'utf8').trim());
            core.setOutput('head_sha',  fs.readFileSync('artifacts/head_sha', 'utf8').trim());

  parse_run_context:
    runs-on: ubuntu-latest
    needs: download_repo_name
    outputs:
      repository: '${{ steps.ctx.outputs.REPO }}'
      sha: '${{ steps.ctx.outputs.SHA }}'
    steps:
      - id: ctx
        env:
          REPO: '${{ needs.download_repo_name.outputs.repo_name || github.repository }}'
          SHA: '${{ needs.download_repo_name.outputs.head_sha || github.sha }}'
        run: |
          echo "REPO=$REPO" >> "$GITHUB_OUTPUT"
          echo "SHA=$SHA" >> "$GITHUB_OUTPUT"

  e2e_test:
    runs-on: ubuntu-latest
    needs: parse_run_context
    steps:
      - name: 'Show resolved target (proof)'
        env:
          REPO: '${{ needs.parse_run_context.outputs.repository }}'
          SHA: '${{ needs.parse_run_context.outputs.sha }}'
        run: echo "checking out repository=$REPO ref=$SHA"
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0 pre-guard, matches gemini-cli
        with:
          repository: '${{ needs.parse_run_context.outputs.repository }}'
          ref: '${{ needs.parse_run_context.outputs.sha }}'
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
      - name: 'Install dependencies'
        run: npm ci || npm install
      - name: 'Build project'
        run: npm run build --if-present
      - name: 'Run E2E tests'
        env:
          GEMINI_API_KEY: '${{ secrets.GEMINI_API_KEY }}'
        run: npm test
